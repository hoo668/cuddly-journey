name: Enrich login IPs in MongoDB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-mongodb-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    environment: Atlas
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MongoDB client
        run: python -m pip install -r ip/requirements-mongodb.txt
      - name: Seed demo data and enrich stale IPs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || 'ip_lookup' }}
          MONGODB_COLLECTION: ${{ vars.MONGODB_COLLECTION || 'login_ip' }}
        run: |
          python ip/enrich_mongodb.py --seed-demo --force --limit 0 --refresh-days 30 > mongo-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("mongo-summary.json").read_text())
          print("## MongoDB login-IP enrichment")
          print()
          for key in ("database", "collection", "seeded_demo_documents", "scanned", "modified", "unique_ips_queried", "complete", "partial", "failed", "invalid_ip"):
              print(f"- **{key}**: {report[key]}")
          PY